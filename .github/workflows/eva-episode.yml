name: "Ева: новый выпуск"

on:
  schedule:
    - cron: "7 6 * * 1,3,5"  # пн, ср, пт в 09:07 по Москве (06:07 UTC)
  workflow_dispatch:
    inputs:
      topic:
        description: "Тема выпуска (пусто — шоураннер выберет сам)"
        required: false

permissions:
  contents: write

concurrency:
  group: eva
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: youtube/requirements.txt

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fontconfig
          sudo apt-get install -y -qq fonts-montserrat || echo "Montserrat недоступен, будет DejaVu"

      - run: pip install -r youtube/requirements.txt

      - name: Make episode
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_URL: ${{ vars.TELEGRAM_URL }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          IMAGE_RESOLUTION: ${{ vars.IMAGE_RESOLUTION }}
          LIPSYNC_MODEL: ${{ vars.LIPSYNC_MODEL }}
          LIPSYNC_RESOLUTION: ${{ vars.LIPSYNC_RESOLUTION }}
          VIDEO_TOPIC: ${{ inputs.topic }}
        run: python youtube/main.py --topic "$VIDEO_TOPIC"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-${{ github.run_number }}
          path: |
            youtube/out/*.mp4
            youtube/out/*.jpg
            youtube/out/*.json
            youtube/out/*/script.md
            youtube/out/*/brief.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Save episode history
        run: |
          git config user.name "eva-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add youtube/history.json
          git diff --cached --quiet && exit 0
          git commit -m "eva: history update"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
