name: "Ева: кастинг внешности"

on:
  workflow_dispatch:
    inputs:
      pick:
        description: "Номер понравившегося варианта (пусто — сгенерировать 4 новых)"
        required: false
      wishes:
        description: "Пожелания к внешности (необязательно)"
        required: false

permissions:
  contents: write

concurrency:
  group: eva
  cancel-in-progress: false

jobs:
  casting:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # bpy (Blender) для 3D-Евы требует 3.11
          cache: pip
          cache-dependency-path: youtube/requirements.txt

      - run: pip install -r youtube/requirements.txt

      - name: Install Blender (3D Eva)
        if: hashFiles('youtube/persona/eva.vrm') != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libegl1 libegl-mesa0 libgl1-mesa-dri libgl1 libxkbcommon0 \
            libsm6 libxi6 libxxf86vm1 libxfixes3 libxrender1
          pip install -r youtube/requirements-3d.txt

      - name: Casting
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          IMAGE_RESOLUTION: ${{ vars.IMAGE_RESOLUTION }}
          PICK: ${{ inputs.pick }}
          WISHES: ${{ inputs.wishes }}
        run: |
          if [ -n "$PICK" ]; then
            python youtube/casting.py --pick "$PICK"
          else
            python youtube/casting.py --wishes "$WISHES"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: casting-${{ github.run_number }}
          path: |
            youtube/persona/candidates/
            youtube/out/preview/eva_3d.*
          retention-days: 14
          if-no-files-found: ignore

      - name: Save
        run: |
          git config user.name "eva-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add -A youtube/persona
          git diff --cached --quiet && exit 0
          git commit -m "eva: casting update"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
